name: DailyFlow

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""

targets:
  DailyFlow:
    type: application
    platform: iOS
    sources:
      - path: App
      # Widget faces and the tick intent, shared with the widget (the DEBUG gallery draws them too).
      - path: WidgetUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dailyflow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Daily Flow
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # iPhone-only and portrait. The iPad key only satisfies Xcode's multitasking validation.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: DailyFlowCore
        embed: true
      - target: DailyFlowWidget
        embed: true
      - sdk: AppIntents.framework

  DailyFlowWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - Info.plist
      - path: WidgetUI
      # The app's theme tokens, type styles and fonts, so widgets match the Chrome Conveyor look.
      # The extension has its own bundle, so it carries its own copy of the fonts.
      - path: App/Theme/Palette.swift
      - path: App/Theme/Typography.swift
      - path: App/Components/ChromeText.swift
      - path: App/Components/IridescentFill.swift
      - path: App/Fonts/Syne-Variable.ttf
      - path: App/Fonts/Inter-Variable.ttf
    dependencies:
      # Linked, not embedded: the app embeds the one copy in DailyFlow.app/Frameworks.
      - target: DailyFlowCore
        embed: false
      - sdk: AppIntents.framework
    # NSExtension has no INFOPLIST_KEY_* equivalent, so the extension uses an
    # explicit, XcodeGen-written Info.plist (GENERATE_INFOPLIST_FILE off).
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Daily Flow
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dailyflow.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        # Finds DailyFlowCore.framework in the containing app (PlugIns/X.appex -> ../../Frameworks).
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground

  # Shared engine: SwiftData models, day rollover, notice days, snapshot, reminder planning and widget
  # data. Embedded in the app and linked by the widget. Extension-safe.
  DailyFlowCore:
    type: framework
    platform: iOS
    sources:
      - path: Core
    dependencies:
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dailyflow.core
        PRODUCT_NAME: DailyFlowCore
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  # Unit tests for the engine. No host app: they run straight against the framework.
  DailyFlowCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoreTests
    dependencies:
      - target: DailyFlowCore
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.dailyflow.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DailyFlow:
    build:
      targets:
        DailyFlow: all
        DailyFlowCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DailyFlowCoreTests
    archive:
      config: Release
