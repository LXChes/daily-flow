name: Build IPA

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-latest (macOS 26 arm64) jobs were cancelled unstarted ("not acquired by Runner",
    # GitHub arm64 capacity constraints). macos-26-intel is the same macOS 26 image family with the
    # same pinned Xcode 26.6 and is a standard runner (free on public repos). Switch back to
    # macos-latest once arm64 capacity recovers.
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      XCODE_VERSION: "26.6"
      XCODEGEN_VERSION: "2.48.0"
      # Plan A for widgets (docs/widgets-shared-folder.md): record an App Group request in the IPA so
      # SideStore can grant the app and widget a shared folder. "false" drops the request (plan B:
      # widgets stay in basic mode). The app and widgets run safely either way.
      REQUEST_APP_GROUP: "true"
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::${XCODE_APP} not found on this runner image. Installed Xcode versions:"
            ls /Applications | grep Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project DailyFlow.xcodeproj \
            -scheme DailyFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DailyFlow.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Fail on build warnings
        run: |
          # SWIFT_TREAT_WARNINGS_AS_ERRORS covers Swift only; this also catches Xcode tool,
          # asset catalog and Info.plist validation warnings (quality gate: zero warnings).
          if grep -E "warning: " "$RUNNER_TEMP/archive.log" | sort -u > "$RUNNER_TEMP/warnings.txt"; then
            while IFS= read -r line; do echo "::warning::${line}"; done < "$RUNNER_TEMP/warnings.txt"
            echo "::error::Build produced $(wc -l < "$RUNNER_TEMP/warnings.txt" | tr -d ' ') warning(s)."
            exit 1
          fi
          echo "No build warnings."

      # Ad-hoc signing needs no certificate, team or account: it only writes the entitlement request
      # into the binaries. SideStore re-signs everything with the owner's Apple ID at install time.
      # Inner bundles first, then the app.
      - name: Request shared folder (ad-hoc sign with App Group)
        if: env.REQUEST_APP_GROUP == 'true'
        run: |
          APP="$RUNNER_TEMP/DailyFlow.xcarchive/Products/Applications/DailyFlow.app"
          WIDGET="$APP/PlugIns/DailyFlowWidget.appex"
          codesign --force --sign - --timestamp=none "$APP/Frameworks/DailyFlowCore.framework"
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements Signing/DailyFlowWidget.entitlements "$WIDGET"
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements Signing/DailyFlow.entitlements "$APP"
          for bundle in "$APP" "$WIDGET"; do
            if ! codesign -d --entitlements - --xml "$bundle" 2>/dev/null | grep -q "group.com.example.dailyflow"; then
              echo "::error::App Group request missing from $(basename "$bundle")"
              exit 1
            fi
          done
          codesign --verify --deep --strict "$APP"
          echo "App Group requested by DailyFlow.app and DailyFlowWidget.appex."

      - name: Package IPA
        run: |
          APP="$RUNNER_TEMP/DailyFlow.xcarchive/Products/Applications/DailyFlow.app"
          if [ ! -d "$APP" ]; then
            echo "::error::DailyFlow.app missing from archive"
            find "$RUNNER_TEMP/DailyFlow.xcarchive" -maxdepth 4 | head -50
            exit 1
          fi
          if [ ! -d "$APP/Frameworks/DailyFlowCore.framework" ]; then
            echo "::error::DailyFlowCore.framework is not embedded in DailyFlow.app/Frameworks"
            ls -la "$APP" "$APP/Frameworks" || true
            exit 1
          fi
          if [ ! -d "$APP/PlugIns/DailyFlowWidget.appex" ]; then
            echo "::error::DailyFlowWidget.appex is not embedded in DailyFlow.app/PlugIns"
            ls -la "$APP" "$APP/PlugIns" || true
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry DailyFlow.ipa Payload
          ls -lh DailyFlow.ipa
          unzip -l DailyFlow.ipa | head -30

      - name: Job summary
        run: |
          APP="$RUNNER_TEMP/DailyFlow.xcarchive/Products/Applications/DailyFlow.app"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          SIZE="$(ls -lh "$RUNNER_TEMP/ipa/DailyFlow.ipa" | awk '{print $5}')"
          {
            echo "## Daily Flow IPA"
            echo ""
            echo "- Version: ${VERSION}"
            echo "- Build number: ${BUILD}"
            echo "- IPA size: ${SIZE}"
            echo "- Commit: ${GITHUB_SHA::7}"
            echo "- Shared folder (App Group) requested: ${REQUEST_APP_GROUP}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: DailyFlow-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/DailyFlow.ipa
          if-no-files-found: error
          retention-days: 30

      # Tests run after the IPA upload, so a simulator problem never blocks the download, but any
      # failure still fails this job, which stops the main-branch Release.
      - name: Pick iOS simulator
        id: simulator
        run: |
          xcrun simctl list runtimes available
          UDID="$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries | sort_by(.key)[] | select(.key | contains("iOS"))
              | .value[] | select(.name | startswith("iPhone"))] | last | .udid // empty')"
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator on this runner image."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit tests (iOS simulator)
        run: |
          xcodebuild test \
            -project DailyFlow.xcodeproj \
            -scheme DailyFlow \
            -configuration Debug \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/TestDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Fail on test build warnings
        run: |
          if grep -E "warning: " "$RUNNER_TEMP/test.log" | sort -u > "$RUNNER_TEMP/test-warnings.txt"; then
            while IFS= read -r line; do echo "::warning::${line}"; done < "$RUNNER_TEMP/test-warnings.txt"
            echo "::error::Test build produced $(wc -l < "$RUNNER_TEMP/test-warnings.txt" | tr -d ' ') warning(s)."
            exit 1
          fi
          echo "No test build warnings."

      - name: Test summary
        if: always() && steps.simulator.outcome == 'success'
        run: |
          {
            echo "## Unit tests"
            echo ""
            if grep -qE "\*\* TEST SUCCEEDED \*\*" "$RUNNER_TEMP/test.log" 2>/dev/null; then
              echo "- Result: passed"
            else
              echo "- Result: FAILED (see the test-log artifact)"
            fi
            grep -E "Test run with [0-9]+ tests" "$RUNNER_TEMP/test.log" | tail -1 | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test log
        if: always() && steps.simulator.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/Tests.xcresult
          if-no-files-found: warn
          retention-days: 14

      # UI screenshots (M3+): launch the Debug simulator build from the test step in demo mode, one
      # scene per launch, and upload the PNGs. Never fails the build; the summary says if it was skipped.
      - name: UI screenshots (iOS simulator)
        id: screenshots
        if: steps.simulator.outcome == 'success'
        continue-on-error: true
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          APP="$RUNNER_TEMP/TestDerivedData/Build/Products/Debug-iphonesimulator/DailyFlow.app"
          OUT="$RUNNER_TEMP/screenshots"
          mkdir -p "$OUT"
          test -d "$APP"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "10:15" --batteryState charged --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          for scene in day day-light list list-light watch watch-light sorted triage add view settings notice ring bar number \
            remind settings-off widgets widgets-light widgets-lock widgets-basic; do
            xcrun simctl terminate "$UDID" com.example.dailyflow 2>/dev/null || true
            xcrun simctl launch "$UDID" com.example.dailyflow -DFDemo YES -DFScene "$scene"
            sleep 6
            xcrun simctl io "$UDID" screenshot --type=png "$OUT/$scene.png"
            echo "captured $scene"
          done
          ls -la "$OUT"
          # Crash reports from the demo launches (if any), so a scene that dies can be diagnosed.
          mkdir -p "$OUT/crashes"
          find "$HOME/Library/Logs/DiagnosticReports" -name 'DailyFlow*' -newer "$APP" \
            -exec cp {} "$OUT/crashes/" \; 2>/dev/null || true
          ls -la "$OUT/crashes"

      - name: Upload screenshots
        if: steps.screenshots.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/screenshots/*.png
            ${{ runner.temp }}/screenshots/crashes/
          if-no-files-found: warn
          retention-days: 14

      - name: Screenshot summary
        if: always() && steps.simulator.outcome == 'success'
        run: |
          {
            echo "## UI screenshots"
            echo ""
            echo "- Result: ${{ steps.screenshots.outcome }} (artifact screenshots-${{ github.run_number }})"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v8
        with:
          name: DailyFlow-ipa-${{ github.run_number }}
          path: ipa

      - name: Replace latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          test -f ipa/DailyFlow.ipa
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ipa/DailyFlow.ipa \
            --title "Daily Flow (latest build)" \
            --notes "Unsigned IPA for sideloading. Build ${RUN_NUMBER}, commit ${SHA::7}." \
            --target "$SHA" \
            --latest
